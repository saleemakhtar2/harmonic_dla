[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonic-dla"
version = "0.1.0"
description = "Accuracy-controlled two-dimensional off-lattice diffusion-limited aggregation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Paper authors" }]
keywords = ["DLA", "Brownian motion", "harmonic measure", "Monte Carlo", "Numba"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "numba>=0.65,<0.67",
  "numpy>=2.0,<2.5",
]

[project.scripts]
hdla = "harmonic_dla.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "pytest>=9,<10",
  "pytest-benchmark>=5.1,<6",
  "pytest-cov>=7,<8",
  "matplotlib>=3.8,<4",
  "reportlab>=4,<5",
  "ruff>=0.16,<0.17",
  "ty>=0.0.40,<0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harmonic_dla = ["py.typed"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.11.0,<0.12"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks", "scripts"]
extend-exclude = ["paper"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF",
  "PERF", "NPY", "PTH", "ARG", "ANN",
]
ignore = ["ANN401", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG001", "ARG002"]
"benchmarks/**/*.py" = ["ANN", "ARG001", "ARG002"]
"src/harmonic_dla/backends/base.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unresolved-import = "error"

[[tool.ty.overrides]]
include = ["src/harmonic_dla/backends/numba_cpu/**"]

[tool.ty.overrides.rules]
invalid-return-type = "ignore"
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
markers = [
  "slow: longer-running statistical or integration test",
  "benchmark: performance benchmark",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["harmonic_dla"]
omit = [
  "src/harmonic_dla/backends/numba_cpu/kernels.py",
  "src/harmonic_dla/backends/numba_cpu/quadtree.py",
  "src/harmonic_dla/backends/numba_cpu/rng.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
